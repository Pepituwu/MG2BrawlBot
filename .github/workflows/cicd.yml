name: CICD

on:
  push:
    branches:
      - main
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: python -m py_compile main.py && echo "✓ Python syntax valid"

      - name: Check requirements.txt
        run: |
          if [ ! -f requirements.txt ]; then
            echo "✗ requirements.txt not found"
            exit 1
          fi
          echo "✓ requirements.txt exists"

      - name: Validate Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "✗ Dockerfile not found"
            exit 1
          fi
          echo "✓ Dockerfile exists"

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name || github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Call Portainer webhook
        if: github.event_name == 'release'
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "⚠️  PORTAINER_WEBHOOK_URL secret not set, skipping webhook"
            exit 0
          fi
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.ref }}","tag":"${{ github.event.release.tag_name }}"}' \
            --fail --silent --show-error
          echo "✓ Portainer webhook called successfully"
